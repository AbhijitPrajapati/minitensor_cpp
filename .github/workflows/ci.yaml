name: Release Tests

# Runs on pushes and PRs
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tests:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Other compiler jobs won't exit if one fails
      fail-fast: false
      # Matrix jobs: one for each compiler
      matrix:
        include:
          - os: ubuntu-24.04
            preset: gcc-release

          - os: ubuntu-24.04
            preset: clang-release

          - os: windows-2022
            preset: msvc-release

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.0.2'

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show build tools
        run: |
          cmake --version
          ninja --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --no-tests=error